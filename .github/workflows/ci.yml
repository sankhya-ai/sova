name: CI
on: [push, pull_request]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      # The demo exercises emit, lint and the repeated-run gate in a real browser.
      - name: Gate the demo app
        working-directory: examples/demo-app
        run: |
          npm ci
          npx playwright install --with-deps chromium
          node ../../dist/cli.js emit --check
          node ../../dist/cli.js check --repeat 3
          node ../../dist/cli.js coverage
