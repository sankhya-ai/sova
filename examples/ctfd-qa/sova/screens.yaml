    trail: challenge-correct-flag-scores
  - kind: invalid
    na: 'read-only page: it takes no input'
  - kind: empty
    skip: 'hand-written spec, not a trail: server-rules.spec.ts > The scoreboard lists nobody while nothing is solved'
  - kind: boundary
    na: no limits on a read-only list in this setup (no paging at this size)
  - kind: permission
    na: score visibility is public in this setup
  - kind: server-error
    skip: 'not tested: the server cannot be made to fail on demand without editing it (the mutation run covers broken code, not outages)'
