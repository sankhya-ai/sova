  - kind: valid
    trail: challenge-correct-flag-scores
  - kind: invalid
    trail: challenge-wrong-flag
  - kind: empty
    skip: 'hand-written spec, not a trail: server-rules.spec.ts > An empty flag is not accepted'
  - kind: boundary
    trail: challenge-flag-prefix
  - kind: permission
    trail: signed-out-redirects-to-login
  - kind: server-error
    skip: 'not tested: the server cannot be made to fail on demand without editing it (the mutation run covers broken code, not outages)'
