screens:
- id: login
  route: /login
  source: ctfd/CTFd/auth.py
  trails:
  - sign-in-user
  - login-wrong-password
  cases:
  - kind: valid
    trail: sign-in-user
  - kind: invalid
    trail: login-wrong-password
  - kind: empty
    skip: 'hand-written spec, not a trail: server-rules.spec.ts > Login with empty fields is rejected'
  - kind: boundary
    skip: 'hand-written spec, not a trail: server-rules.spec.ts > Login is rate limited after 10 wrong attempts'
  - kind: permission
    na: 'sign-in has no permission rule: it is open to everyone and a signed-in user just sees it again'
  - kind: server-error
    skip: 'not tested: the server cannot be made to fail on demand without editing it (the mutation run covers broken code, not outages)'
- id: register
  route: /register
  source: ctfd/CTFd/auth.py
  trails:
  - register-new-user
  - register-duplicate-name
  cases:
  - kind: valid
    trail: register-new-user
  - kind: invalid
    trail: register-duplicate-name
  - kind: empty
    skip: 'hand-written spec, not a trail: server-rules.spec.ts > Register with an empty name is rejected'
  - kind: boundary
    skip: 'hand-written spec, not a trail: server-rules.spec.ts > Register with a password over 128 characters is rejected'
  - kind: permission
    na: registration is open to everyone in this setup
  - kind: server-error
    skip: 'not tested: the server cannot be made to fail on demand without editing it (the mutation run covers broken code, not outages)'
