config:
  devices:
    web:
      driver: PLAYWRIGHT_NATIVE
  title: auto admin-users-new valid

trail:
  - step: "Open /admin/users/new"
    recording:
      web:
        - web_navigate:
            url: "http://127.0.0.1:4000/admin/users/new"

  - step: "Type User Name"
    recording:
      web:
        - web_type:
            text: "sova-plan"
            ref: "textbox \"User Name\""

  - step: "Type Email"
    recording:
      web:
        - web_type:
            text: "{{unique.sova-plan@example.com}}"
            ref: "textbox \"Email\""

  - step: "Type Password"
    recording:
      web:
        - web_type:
            text: "plan-pass-123"
            ref: "textbox \"Password\""

  - step: "Type Website"
    recording:
      web:
        - web_type:
            text: "sova-plan"
            ref: "textbox \"Website\""

  - step: "Type Affiliation"
    recording:
      web:
        - web_type:
            text: "sova-plan"
            ref: "textbox \"Affiliation\""

  - step: "Submit the form"
    recording:
      web:
        - web_click:
            ref: "button \"Submit\""

