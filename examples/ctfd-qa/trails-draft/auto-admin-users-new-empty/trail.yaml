config:
  devices:
    web:
      driver: PLAYWRIGHT_NATIVE
  title: auto admin-users-new empty

trail:
  - step: "Open /admin/users/new"
    recording:
      web:
        - web_navigate:
            url: "http://127.0.0.1:4000/admin/users/new"

  - step: "Submit with nothing filled in"
    recording:
      web:
        - web_click:
            ref: "button \"Submit\""

  - step: "The first required field is still on screen"
    recording:
      web:
        - web_verifyElementVisible:
            ref: "textbox \"User Name\""

