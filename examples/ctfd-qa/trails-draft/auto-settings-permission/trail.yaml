config:
  devices:
    web:
      driver: PLAYWRIGHT_NATIVE
  title: auto settings permission

trail:
  - step: "Open /settings signed out"
    recording:
      web:
        - web_navigate:
            url: "http://127.0.0.1:4000/settings"

  - step: "The sign-in page is shown"
    recording:
      web:
        - web_waitForUrl:
            pattern: "/login"

