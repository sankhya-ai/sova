config:
  devices:
    web:
      driver: PLAYWRIGHT_NATIVE
  title: auto admin-pages-id empty

trail:
  - step: "Open /admin/pages/:id"
    recording:
      web:
        - web_navigate:
            url: "http://127.0.0.1:4000/admin/pages/:id"

  - step: "Submit with nothing filled in"
    recording:
      web:
        - web_click:
            ref: "button \"Save\""

