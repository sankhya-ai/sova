config:
  devices:
    web:
      driver: PLAYWRIGHT_NATIVE
  title: auto admin-users-id permission

trail:
  - step: "Open /admin/users/:id signed out"
    recording:
      web:
        - web_navigate:
            url: "http://127.0.0.1:4000/admin/users/1"

  - step: "The sign-in page is shown"
    recording:
      web:
        - web_waitForUrl:
            pattern: "/login"

