config:
  devices:
    web:
      driver: PLAYWRIGHT_NATIVE
  title: auto admin-challenges-id empty

trail:
  - step: "Open /admin/challenges/:id"
    recording:
      web:
        - web_navigate:
            url: "http://127.0.0.1:4000/admin/challenges/1"

  - step: "Submit with nothing filled in"
    recording:
      web:
        - web_click:
            ref: "button \"Create Solution\""

