config:
  devices:
    web:
      driver: PLAYWRIGHT_NATIVE
  title: auto admin-challenges permission

trail:
  - step: "Open /admin/challenges signed out"
    recording:
      web:
        - web_navigate:
            url: "http://127.0.0.1:4000/admin/challenges"

  - step: "The sign-in page is shown"
    recording:
      web:
        - web_waitForUrl:
            pattern: "/login"

