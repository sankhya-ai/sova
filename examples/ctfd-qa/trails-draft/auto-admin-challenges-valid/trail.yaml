config:
  devices:
    web:
      driver: PLAYWRIGHT_NATIVE
  title: auto admin-challenges valid

trail:
  - step: "Open /admin/challenges"
    recording:
      web:
        - web_navigate:
            url: "http://127.0.0.1:4000/admin/challenges"

  - step: "Type Search for matching challenge"
    recording:
      web:
        - web_type:
            text: "sova-plan"
            ref: "textbox \"Search for matching challenge\""

  - step: "Submit the form"
    recording:
      web:
        - web_click:
            ref: "button \"Submit\""

