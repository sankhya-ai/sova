config:
  devices:
    web:
      driver: PLAYWRIGHT_NATIVE
  title: auto admin-modules-new permission

trail:
  - step: "Open /admin/modules/new signed out"
    recording:
      web:
        - web_navigate:
            url: "http://127.0.0.1:4000/admin/modules/new"

  - step: "The sign-in page is shown"
    recording:
      web:
        - web_waitForUrl:
            pattern: "/login"

