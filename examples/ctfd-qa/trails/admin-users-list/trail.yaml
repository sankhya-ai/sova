config:
  devices:
    web:
      driver: PLAYWRIGHT_NATIVE
  title: admin-users-list

trail:
  - step: "Open the admin users"
    recording:
      web:
        - web_navigate:
            url: "http://127.0.0.1:4000/admin/users"

  - step: "The regular user is listed"
    recording:
      web:
        - web_verifyElementVisible:
            ref: "link \"qa-user\""

