config:
  devices:
    web:
      driver: PLAYWRIGHT_NATIVE
  title: signed-out-redirects-to-login

trail:
  - step: "Open the challenges while signed out"
    recording:
      web:
        - web_navigate:
            url: "http://127.0.0.1:4000/challenges"

  - step: "The login form is shown"
    recording:
      web:
        - web_verifyElementVisible:
            ref: "textbox \"User Name or Email\""

