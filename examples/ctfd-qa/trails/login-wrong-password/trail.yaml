config:
  devices:
    web:
      driver: PLAYWRIGHT_NATIVE
  title: login-wrong-password

trail:
  - step: "Open the login page"
    recording:
      web:
        - web_navigate:
            url: "http://127.0.0.1:4000/login"

  - step: "Type the user name"
    recording:
      web:
        - web_type:
            text: "{{env.USER_NAME}}"
            ref: "textbox \"User Name or Email\""

  - step: "Type the password"
    recording:
      web:
        - web_type:
            text: "definitely-wrong-pass"
            ref: "textbox \"Password\""

  - step: "Press Submit"
    recording:
      web:
        - web_click:
            ref: "button \"Submit\""

  - step: "The error is shown"
    recording:
      web:
        - web_verifyElementVisible:
            ref: "css=text=Your username or password is incorrect"

