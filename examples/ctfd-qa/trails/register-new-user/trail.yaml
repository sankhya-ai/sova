config:
  devices:
    web:
      driver: PLAYWRIGHT_NATIVE
  title: register-new-user

trail:
  - step: "Open the register page"
    recording:
      web:
        - web_navigate:
            url: "http://127.0.0.1:4000/register"

  - step: "Type a new name"
    recording:
      web:
        - web_type:
            text: "sova-newuser"
            ref: "textbox \"User Name\""

  - step: "Type an email"
    recording:
      web:
        - web_type:
            text: "{{unique.sova-newuser@example.com}}"
            ref: "textbox \"Email\""

  - step: "Type a password"
    recording:
      web:
        - web_type:
            text: "secret-pass-123"
            ref: "textbox \"Password\""

  - step: "Press Submit"
    recording:
      web:
        - web_click:
            ref: "button \"Submit\""

  - step: "The challenges page opens"
    recording:
      web:
        - web_waitForUrl:
            pattern: "/challenges"

