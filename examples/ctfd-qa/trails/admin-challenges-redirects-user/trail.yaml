config:
  devices:
    web:
      driver: PLAYWRIGHT_NATIVE
  title: admin-challenges-redirects-user

trail:
  - step: "Open the admin challenges as a regular user"
    recording:
      web:
        - web_navigate:
            url: "http://127.0.0.1:4000/admin/challenges"

  - step: "The login form is shown instead"
    recording:
      web:
        - web_verifyElementVisible:
            ref: "textbox \"User Name or Email\""

