screens:
- id: login
  route: /auth/login
  source: flaskbb/auth/views.py
  trails:
  - login-wrong-password
  - sign-in
  cases:
  - kind: valid
    trail: sign-in
  - kind: invalid
    trail: login-wrong-password
  - kind: empty
    skip: 'hand-written spec, not a trail: sova/tests/hand-login-empty.spec.ts > two tests'
  - kind: boundary
    skip: account lockout after repeated failed logins exists in code (login_attempts) but would lock a seeded account; not tested
  - kind: permission
    na: page is open to signed-out visitors
  - kind: server-error
    skip: cannot make the backend fail on demand
- id: register
  route: /auth/register
  source: flaskbb/auth/views.py
  trails:
  - register-valid
  - register-taken-username
  - register-forbidden-username
  - register-username-too-short
  - register-password-mismatch
  - register-taken-email
  cases:
  - kind: valid
    trail: register-valid
  - kind: invalid
    trail: register-taken-username
  - kind: empty
    skip: browser blocks the empty required field; needs a hand-written spec, not written yet (register form)
  - kind: boundary
    trail: register-username-too-short
  - kind: permission
    na: page is open to signed-out visitors
  - kind: server-error
    skip: cannot make the backend fail on demand
