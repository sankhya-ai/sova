config:
  devices:
    web:
      driver: PLAYWRIGHT_NATIVE
  title: sign-in-mod

trail:
  - step: "Open /auth/login"
    recording:
      web:
        - web_navigate:
            url: http://localhost:5000/auth/login

  - step: "Type the mod username"
    recording:
      web:
        - web_type:
            text: "{{env.APP_MOD_USER}}"
            ref: "textbox \"Username or Email address\""

  - step: "Type the mod password"
    recording:
      web:
        - web_type:
            text: "{{env.APP_MOD_PASSWORD}}"
            ref: "textbox \"Password\""

  - step: "Press Login"
    recording:
      web:
        - web_click:
            ref: "button \"Login\""

  - step: "The mod username is shown in the navbar"
    recording:
      web:
        - web_verifyElementVisible:
            ref: "link \"mod1\""
