config:
  devices:
    web:
      driver: PLAYWRIGHT_NATIVE
  title: admin-add-user-taken

trail:
  - step: "Open the add-user form"
    recording:
      web:
        - web_navigate:
            url: http://localhost:5000/admin/users/add

  - step: "Type a taken username"
    recording:
      web:
        - web_type:
            text: alice
            ref: textbox "Username"

  - step: "Type a new email"
    recording:
      web:
        - web_type:
            text: "{{unique.x@example.com}}"
            ref: textbox "Email address"

  - step: "Type a password"
    recording:
      web:
        - web_type:
            text: Pass-12345
            ref: textbox "Password"

  - step: "Press Save"
    recording:
      web:
        - web_click:
            ref: button "Save"

  - step: "The error says the username is taken [code]"
    recording:
      web:
        - web_verifyValue:
            ref: css=.invalid-feedback
            expected: This username is already taken.
