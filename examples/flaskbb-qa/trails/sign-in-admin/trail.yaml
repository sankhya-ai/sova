config:
  devices:
    web:
      driver: PLAYWRIGHT_NATIVE
  title: sign-in-admin

trail:
  - step: "Open /auth/login"
    recording:
      web:
        - web_navigate:
            url: http://localhost:5000/auth/login

  - step: "Type the admin username"
    recording:
      web:
        - web_type:
            text: "{{env.APP_ADMIN_USER}}"
            ref: "textbox \"Username or Email address\""

  - step: "Type the admin password"
    recording:
      web:
        - web_type:
            text: "{{env.APP_ADMIN_PASSWORD}}"
            ref: "textbox \"Password\""

  - step: "Press Login"
    recording:
      web:
        - web_click:
            ref: "button \"Login\""

  - step: "Open the admin overview"
    recording:
      web:
        - web_navigate:
            url: http://localhost:5000/admin/

  - step: "The management overview is shown to the admin [code]"
    recording:
      web:
        - web_verifyElementVisible:
            ref: "heading \"Everything seems alright.\""
