config:
  devices:
    web:
      driver: PLAYWRIGHT_NATIVE
  title: sign-in

trail:
  - step: "Open /auth/login"
    recording:
      web:
        - web_navigate:
            url: http://localhost:5000/auth/login

  - step: "Type the username"
    recording:
      web:
        - web_type:
            text: "{{env.APP_TEST_EMAIL}}"
            ref: "textbox \"Username or Email address\""

  - step: "Type the password"
    recording:
      web:
        - web_type:
            text: "{{env.APP_TEST_PASSWORD}}"
            ref: "textbox \"Password\""

  - step: "Press Login"
    recording:
      web:
        - web_click:
            ref: "button \"Login\""

  - step: "The signed-in username is shown in the navbar"
    recording:
      web:
        - web_verifyElementVisible:
            ref: "link \"alice\""
